name: E2E Tests Workflow
on:
  pull_request:
  merge_group:
  schedule:
    - cron:  '0 8 * * *'
  workflow_dispatch:
jobs:
  end-2-end-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - MAGENTO_VERSION: 2.4.5
          - MAGENTO_VERSION: 2.4.6
          - MAGENTO_VERSION: 2.4.7

    env:
      MAGENTO_VERSION: ${{ matrix.MAGENTO_VERSION }}
      RVVUP_PLUGIN_VERSION: checkout
      MAGENTO_REPO_PUBLIC_KEY: ${{ secrets.REPO_PUB_KEY }}
      MAGENTO_REPO_PRIVATE_KEY: ${{ secrets.REPO_SEC_KEY }}
      RVVUP_API_KEY: ${{ secrets.RVVUP_API_KEY }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Start Docker
        run: |
          docker compose up -d --build

      - name: Install dependencies
        run: npm install
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for Magento Store
        run: bash scripts/helpers/wait-for-server-startup.sh

      - name: Run Playwright tests
        run: TEST_BASE_URL=http://localhost npx playwright test

      - name: Prepare logs
        if: always()
        run: |
            mkdir -p logs/magento
            docker compose logs > logs/container_logs.log
            docker compose cp magento:/bitnami/magento/var/log logs/magento
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.MAGENTO_VERSION }}-${{ github.run_number }}
          path: |
            playwright-report/
            logs/

